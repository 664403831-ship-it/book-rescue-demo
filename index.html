textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const pendingStateWrites = new Map();

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      typeof nextState !== &quot;object&quot; ||

      const timeout = globalThis.setTimeout(() =&gt; {

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      openExternal,

    globalThis.dispatchEvent(

    postToHost(&quot;height&quot;, {

          document.body.getBoundingClientRect().height,
        ),

    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    if (event.defaultPrevented) {

      return;
    }

        &lt;div class=&quot;br-reader-text&quot; id=&quot;br-reader-text&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;br-reader-nav&quot;&gt;
          &lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-prev&quot; disabled&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;上一章&lt;/button&gt;
          &lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-next&quot;&gt;下一章&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;

    &lt;div class=&quot;br-bottom&quot; data-bottom=&quot;needs&quot;&gt;
      &lt;button class=&quot;br-primary cursor-interaction&quot; type=&quot;button&quot; data-go=&quot;results&quot;&gt;按当前偏好推荐 3 本&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;br-bottom&quot; data-bottom=&quot;prompt&quot; hidden&gt;
      &lt;button class=&quot;br-secondary cursor-interaction&quot; type=&quot;button&quot; data-go=&quot;needs&quot;&gt;返回筛选&lt;/button&gt;
      &lt;button class=&quot;br-primary cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-find&quot;&gt;帮我找书&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;br-bottom&quot; data-bottom=&quot;results&quot; hidden&gt;
      &lt;button class=&quot;br-secondary cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-refresh&quot;&gt;&lt;i data-lucide=&quot;refresh-cw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 换一批&lt;/button&gt;
      &lt;button class=&quot;br-primary cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-open-selected&quot;&gt;试读已选小说&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;br-bottom&quot; data-bottom=&quot;trial&quot; hidden&gt;
      &lt;button class=&quot;br-secondary cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-dislike&quot;&gt;不感兴趣&lt;/button&gt;
      &lt;button class=&quot;br-primary cursor-interaction&quot; type=&quot;button&quot; id=&quot;br-choose&quot;&gt;选中并换下一本&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;br-sheet&quot; id=&quot;br-sheet&quot; hidden&gt;
      &lt;div class=&quot;br-sheet-panel&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;br-sheet-title&quot;&gt;
        &lt;div class=&quot;br-handle&quot;&gt;&lt;/div&gt;
        &lt;h3 id=&quot;br-sheet-title&quot;&gt;哪里不合口味？&lt;/h3&gt;
        &lt;p&gt;选择原因后，会自动切换下一本并优化后续推荐。&lt;/p&gt;
        &lt;div class=&quot;br-reasons&quot;&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; type=&quot;button&quot;&gt;开篇节奏太慢&lt;/button&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; type=&quot;button&quot;&gt;人物设定不喜欢&lt;/button&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; type=&quot;button&quot;&gt;文风不合适&lt;/button&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; type=&quot;button&quot;&gt;暂时不想看这个题材&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;br-sheet&quot; id=&quot;br-decision-sheet&quot; hidden&gt;
      &lt;div class=&quot;br-sheet-panel&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;br-decision-title&quot;&gt;
        &lt;div class=&quot;br-handle&quot;&gt;&lt;/div&gt;
        &lt;h3 id=&quot;br-decision-title&quot;&gt;三章读完，接下来呢？&lt;/h3&gt;
        &lt;p&gt;可以先收藏这本，再继续比较下一本推荐。&lt;/p&gt;
        &lt;div class=&quot;br-reasons&quot;&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; id=&quot;br-pick-next-sheet&quot; type=&quot;button&quot;&gt;选中这本，试读下一本&lt;/button&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; id=&quot;br-switch-sheet&quot; type=&quot;button&quot;&gt;暂不选择，直接换下一本&lt;/button&gt;
          &lt;button class=&quot;br-reason-btn cursor-interaction&quot; id=&quot;br-keep-reading&quot; type=&quot;button&quot;&gt;结束试读，继续读这本&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;br-toast&quot; id=&quot;br-toast&quot; role=&quot;status&quot; hidden&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;book-rescue-prototype&#x27;);
      const screens = [...root.querySelectorAll(&#x27;[data-screen]&#x27;)];
      const bottoms = [...root.querySelectorAll(&#x27;[data-bottom]&#x27;)];
      const steps = [...root.querySelectorAll(&#x27;.br-step&#x27;)];
      const order = [&#x27;needs&#x27;, &#x27;prompt&#x27;, &#x27;results&#x27;, &#x27;trial&#x27;];
      const books = [
        { title: &#x27;长安不眠夜&#x27;, meta: &#x27;古代言情 · 68万字 · 已完结&#x27;, reason: &#x27;女主清醒｜权谋轻悬疑｜开篇即入局&#x27;, match: &#x27;96%匹配&#x27;, a: &#x27;#863e38&#x27;, b: &#x27;#d1966a&#x27; },
        { title: &#x27;折月录&#x27;, meta: &#x27;古代言情 · 82万字 · 已完结&#x27;, reason: &#x27;双强成长｜无误会｜感情线克制&#x27;, match: &#x27;91%匹配&#x27;, a: &#x27;#243f59&#x27;, b: &#x27;#7d9da5&#x27; },
        { title: &#x27;春山有信&#x27;, meta: &#x27;古代言情 · 54万字 · 已完结&#x27;, reason: &#x27;轻松群像｜事业线完整｜不虐女主&#x27;, match: &#x27;88%匹配&#x27;, a: &#x27;#5f4a63&#x27;, b: &#x27;#b9959f&#x27; }
      ];
      const chapters = [
        { title: &#x27;第一章 雨夜来客&#x27;, paragraphs: [&#x27;长安城入秋后的第一场雨，下得毫无征兆。檐角的水连成细线，街上最后一盏灯也熄了。&#x27;, &#x27;沈知微合上账册时，门外传来三声叩响。来人没有报姓名，只从门缝下推进一枚染着水汽的铜钱。&#x27;, &#x27;她看了一眼铜钱背面的刻痕，披上外衣：“等了三年的人，终于来了。”&#x27;] },
        { title: &#x27;第二章 旧案新痕&#x27;, paragraphs: [&#x27;铜钱来自三年前那桩无头旧案。朝廷定案时，所有人都说证据确凿，只有沈知微记得卷宗里少了一页。&#x27;, &#x27;来客站在廊下，肩头雨水未干。他递来一张新的供状，上面赫然是本该死去之人的指印。&#x27;, &#x27;沈知微没有惊讶，只问：“你想翻案，还是想活命？”&#x27;] },
        { title: &#x27;第三章 棋局初开&#x27;, paragraphs: [&#x27;天亮前，两人从后门离开。长街尽头的晨鼓尚未敲响，一辆没有徽记的马车已经等在那里。&#x27;, &#x27;车帘掀起一角，露出半张熟悉的脸。沈知微停住脚步，终于明白这不是一桩旧案，而是一封写给她的战书。&#x27;, &#x27;她迈上马车，把那枚铜钱放在棋盘中央：“既然都到齐了，那就开局吧。”&#x27;] }
      ];
      let currentBook = 0;
      let currentChapter = 0;
      const chosenBooks = new Set();
      let toastTimer;

      function renderBooks() {
        const host = root.querySelector(&#x27;#br-books&#x27;);
        host.innerHTML = books.map((b, i) =&gt; `
          &lt;article class=&quot;br-book ${i === currentBook ? &#x27;is-selected&#x27; : &#x27;&#x27;}&quot; data-book=&quot;${i}&quot;&gt;
            &lt;div class=&quot;br-cover&quot; style=&quot;--cover-a:${b.a};--cover-b:${b.b}&quot;&gt;${b.title}&lt;/div&gt;
            &lt;div&gt;&lt;span class=&quot;br-match&quot;&gt;${b.match}&lt;/span&gt;&lt;h3&gt;${b.title}&lt;/h3&gt;&lt;div class=&quot;br-meta&quot;&gt;${b.meta}&lt;/div&gt;&lt;p class=&quot;br-reason&quot;&gt;${b.reason}&lt;/p&gt;&lt;div class=&quot;br-book-actions&quot;&gt;&lt;button class=&quot;br-mini is-main cursor-interaction&quot; type=&quot;button&quot; data-trial=&quot;${i}&quot;&gt;试读3章&lt;/button&gt;&lt;button class=&quot;br-mini cursor-interaction&quot; type=&quot;button&quot; data-select=&quot;${i}&quot;&gt;${i === currentBook ? &#x27;已选择&#x27; : &#x27;选择&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/article&gt;`).join(&#x27;&#x27;);
        host.querySelectorAll(&#x27;[data-select]&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; { currentBook = Number(btn.dataset.select); renderBooks(); showToast(`已选择《${books[currentBook].title}》`); }));
        host.querySelectorAll(&#x27;[data-trial]&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; { currentBook = Number(btn.dataset.trial); currentChapter = 0; renderReader(); showScreen(&#x27;trial&#x27;); }));
      }

      function renderReader() {
        const book = books[currentBook];
        const chapter = chapters[currentChapter];
        root.querySelector(&#x27;#br-reader-title&#x27;).textContent = book.title;
        root.querySelector(&#x27;#br-reader-meta&#x27;).textContent = book.meta.replace(/ · \d+万字/, &#x27;&#x27;);
        root.querySelector(&#x27;#br-chapter-title&#x27;).textContent = chapter.title;
        root.querySelector(&#x27;#br-reader-text&#x27;).innerHTML = chapter.paragraphs.map(p =&gt; `&lt;p&gt;${p}&lt;/p&gt;`).join(&#x27;&#x27;);
        [...root.querySelectorAll(&#x27;.br-chapter-progress span&#x27;)].forEach((bar, i) =&gt; bar.classList.toggle(&#x27;is-read&#x27;, i &lt;= currentChapter));
        root.querySelector(&#x27;#br-prev&#x27;).disabled = currentChapter === 0;
        root.querySelector(&#x27;#br-next&#x27;).innerHTML = currentChapter === 2 ? &#x27;读完了&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; : &#x27;下一章&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function switchToNextBook(message = &#x27;已切换到下一本推荐&#x27;) {
        currentBook = (currentBook + 1) % books.length;
        currentChapter = 0;
        renderBooks();
        renderReader();
        showToast(`${message}：《${books[currentBook].title}》`);
      }

      function chooseAndSwitch() {
        const picked = books[currentBook].title;
        chosenBooks.add(picked);
        root.querySelector(&#x27;#br-decision-sheet&#x27;).hidden = true;
        switchToNextBook(`《${picked}》已加入书架，继续试读`);
      }

      function showScreen(name) {
        const index = order.indexOf(name);
        screens.forEach(s =&gt; { s.hidden = s.dataset.screen !== name; });
        bottoms.forEach(b =&gt; { b.hidden = b.dataset.bottom !== name; });
        steps.forEach((s, i) =&gt; {
          s.classList.toggle(&#x27;is-active&#x27;, s.dataset.go === name);
          s.classList.toggle(&#x27;is-done&#x27;, i &lt; index);
        });
        if (name === &#x27;results&#x27;) renderBooks();
        if (name === &#x27;trial&#x27;) renderReader();
      }

      function showToast(message) {
        const toast = root.querySelector(&#x27;#br-toast&#x27;);
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 1800);
      }

      root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(btn.dataset.go)));
      root.querySelector(&#x27;#br-header-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const current = screens.find(screen =&gt; !screen.hidden)?.dataset.screen;
        const previous = { prompt: &#x27;needs&#x27;, results: &#x27;prompt&#x27;, trial: &#x27;results&#x27; }[current];
        if (previous) showScreen(previous);
        else showToast(&#x27;已经是第一步了&#x27;);
      });
      root.querySelectorAll(&#x27;[data-choice-group]&#x27;).forEach(group =&gt; {
        group.querySelectorAll(&#x27;button&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; {
          const isOn = btn.getAttribute(&#x27;aria-pressed&#x27;) === &#x27;true&#x27;;
          if (group.dataset.single === &#x27;true&#x27;) group.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          if (!isOn &amp;&amp; group.dataset.max) {
            const count = group.querySelectorAll(&#x27;[aria-pressed=&quot;true&quot;]&#x27;).length;
            if (count &gt;= Number(group.dataset.max)) { showToast(`最多选择 ${group.dataset.max} 项`); return; }
          }
          btn.setAttribute(&#x27;aria-pressed&#x27;, String(!isOn));
        }));
      });
      const query = root.querySelector(&#x27;#br-query&#x27;);
      const count = root.querySelector(&#x27;#br-count&#x27;);
      const updateCount = () =&gt; { count.textContent = `${query.value.length}/100`; };
      query.addEventListener(&#x27;input&#x27;, updateCount);
      updateCount();
      root.querySelectorAll(&#x27;.br-example&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; { query.value = btn.textContent.trim(); updateCount(); query.focus(); }));
      root.querySelector(&#x27;#br-find&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!query.value.trim()) { showToast(&#x27;先说说你想看什么&#x27;); return; }
        root.querySelector(&#x27;#br-parsed&#x27;).hidden = false;
        showToast(&#x27;已识别题材、篇幅与人物偏好&#x27;);
        setTimeout(() =&gt; showScreen(&#x27;results&#x27;), 650);
      });
      root.querySelector(&#x27;#br-refresh&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { books.push(books.shift()); currentBook = 0; renderBooks(); showToast(&#x27;已根据反馈更新推荐&#x27;); });
      root.querySelector(&#x27;#br-open-selected&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { currentChapter = 0; showScreen(&#x27;trial&#x27;); });
      root.querySelector(&#x27;#br-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { if (currentChapter &gt; 0) { currentChapter--; renderReader(); } });
      root.querySelector(&#x27;#br-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { if (currentChapter &lt; 2) { currentChapter++; renderReader(); } else { root.querySelector(&#x27;#br-decision-sheet&#x27;).hidden = false; } });
      root.querySelector(&#x27;#br-switch-book&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; switchToNextBook());
      root.querySelector(&#x27;#br-dislike&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#br-sheet&#x27;).hidden = false; });
      root.querySelectorAll(&#x27;#br-sheet .br-reason-btn&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#br-sheet&#x27;).hidden = true; switchToNextBook(&#x27;已记录反馈，继续试读&#x27;); }));
      root.querySelector(&#x27;#br-sheet&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; { if (e.target.id === &#x27;br-sheet&#x27;) e.currentTarget.hidden = true; });
      root.querySelector(&#x27;#br-decision-sheet&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; { if (e.target.id === &#x27;br-decision-sheet&#x27;) e.currentTarget.hidden = true; });
      root.querySelector(&#x27;#br-choose&#x27;).addEventListener(&#x27;click&#x27;, chooseAndSwitch);
      root.querySelector(&#x27;#br-pick-next-sheet&#x27;).addEventListener(&#x27;click&#x27;, chooseAndSwitch);
      root.querySelector(&#x27;#br-switch-sheet&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#br-decision-sheet&#x27;).hidden = true; switchToNextBook(); });
      root.querySelector(&#x27;#br-keep-reading&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#br-decision-sheet&#x27;).hidden = true; chosenBooks.add(books[currentBook].title); showToast(`已加入书架，继续阅读《${books[currentBook].title}》`); });
      renderBooks();
      renderReader();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
